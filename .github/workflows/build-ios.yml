name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir Payload
          mkdir -p build/ios/ipa
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry build/ios/ipa/listatareasflutter-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: listatareasflutter-unsigned-ipa
          path: build/ios/ipa/listatareasflutter-unsigned.ipa
