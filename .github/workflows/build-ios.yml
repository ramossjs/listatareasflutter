name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          ipa_dir="$GITHUB_WORKSPACE/build/ios/ipa"
          payload_dir="$RUNNER_TEMP/ipa/Payload"
          mkdir -p "$ipa_dir" "$payload_dir"
          test -d "$GITHUB_WORKSPACE/build/ios/iphoneos/Runner.app"
          cp -R "$GITHUB_WORKSPACE/build/ios/iphoneos/Runner.app" "$payload_dir/Runner.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$ipa_dir/listatareasflutter-unsigned.ipa" Payload
          test -f "$ipa_dir/listatareasflutter-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: listatareasflutter-unsigned-ipa
          path: build/ios/ipa/listatareasflutter-unsigned.ipa
